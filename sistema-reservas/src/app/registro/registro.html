<div class="login-container">
  <div class="login-card">
    <h1 class="login-title">Crear Cuenta</h1>
    <p class="login-subtitle">Regístrate en el sistema de aulas</p>

    <div class="form-group">
      <label>Nombres Completos</label>
      <input type="text" placeholder="Tus nombres" [(ngModel)]="nuevoUsuario.nombre" name="nombre">
    </div>

    <div class="form-group">
      <label>Código UPN</label>
      <input type="text" placeholder="Ej. N00012345" [(ngModel)]="nuevoUsuario.correo" name="correo">
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" placeholder="Crea una contraseña" [(ngModel)]="nuevoUsuario.password" name="password">
    </div>

    <button class="btn-primary" (click)="crearCuenta()">Registrarme</button>

    <p class="enlace-registro">¿Ya tienes cuenta? <a (click)="irAlLogin()">Inicia sesión</a></p>
  </div>
</div>
