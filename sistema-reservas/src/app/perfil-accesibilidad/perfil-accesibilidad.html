<div class="perfil-container">
  <div class="perfil-card">
    <h2>Configuración de Accesibilidad</h2>
    <p>Personaliza tu experiencia de navegación en el campus.</p>

    <div class="opciones-lista">
      <label class="opcion-item">
        <input type="checkbox">
        <div class="opcion-texto">
          <strong>Priorizar rutas con ascensor / rampas</strong>
          <span>Evitar escaleras en el trazado de rutas.</span>
        </div>
      </label>

      <label class="opcion-item">
        <input type="checkbox">
        <div class="opcion-texto">
          <strong>Modo alto contraste</strong>
          <span>Mejora la visibilidad del mapa y los asientos.</span>
        </div>
      </label>
    </div>

    <button class="btn-primary" (click)="guardarYContinuar()">Guardar y Buscar Sala</button>
  </div>
</div>
