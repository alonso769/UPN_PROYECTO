<div class="login-container">
  <div class="login-card">
    <h1 class="login-title">Portal UPN</h1>
    <p class="login-subtitle">Ingresa para gestionar tu navegación y reservas</p>

    <div class="form-group">
      <label>Código de Estudiante / Usuario</label>
      <input type="text" placeholder="Ej. N00012345">
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" placeholder="********">
    </div>

    <button class="btn-primary" (click)="iniciarSesion()">Ingresar</button>
    
    <p class="enlace-registro">¿No tienes cuenta? <a (click)="irAlRegistro()">Regístrate aquí</a></p>

  </div>
</div>
